 	function ParseTopicsFromCurrPage() 
	{
		var arrTemp = [];

		// Seleccionar anchors
		var anchors = $('a.style-for-subject-link');      
        console.log("anchors.length: ", anchors.length);

		// Extraer el texto
		anchors.each(function() {
			var text = $(this).text();
			if (text)
            {
                console.log("text-before: ", text);
                //text = text.replace(/\s+,$/, "");
                var index = text.indexOf(", ");
                if (index !== -1) {
                  text = text.substring(0, index);
                }
                console.log("text-after: ", text);
				arrTemp.push(text.trim());
			}
		});

		return arrTemp;
	}

	function GetUserData()
	{
		$.ajax({
			type: "GET",
			url: "/Social/UniversalProfile/UPPageRedirectHandler.ashx",
			async: false,
			success: function (es) 
			{
				if (es.includes("TargetUser"))
				{
					var posInicio = es.indexOf("TargetUser") + 10;
					var posFinal = es.substring(posInicio).indexOf('"') + posInicio;
					userId = es.substring(posInicio + 1, posFinal);
				}
				if (es.includes("_____c_bu"))
				{
					var posInicio = es.indexOf("_____c_bu") + 209;
					var posFinal = es.substring(posInicio).indexOf("<") + posInicio;
					empresa = es.substring(posInicio, posFinal);
				}
			},
			error: function (e) 
			{
				console.log(e);
			},
		});
	}

	$(document).ready(function ()
	{
		bUserIsVGEDButNotAdmin = UserIsVGED() && UserIsNotAdmin();
		
		GetUserData();

		if ((bUserIsVGEDButNotAdmin === true) && (userId !== "inspector.fundae"))
		{
			setInterval(function () 
			{
				if (isRunning) return;

				isRunning = true;

				console.log("Inicio llamada a 'HideLODetailPageBtns()'");
				HideLODetailPageBtns();
				console.log("Fin llamada a 'HideLODetailPageBtns()'");

				isRunning = false;
			}, 500);
		}
	});
