  	function ParseTopicsFromPageText(strPageText) 
	{
		var arrTemp = [];

		var parser = new DOMParser();
		var doc = parser.parseFromString(strPageText, "text/html");

		// Seleccionar anchors
		var anchors = doc.querySelectorAll('a.style-for-subject-link');
        console.log("anchors.length: ", anchors.length);

		// Extraer el texto
		anchors.forEach(function(anchor) {
			var text = anchor.textContent;
			if (text)
            {
                console.log("text-before: ", text);
                //text = text.replace(/\s+,$/, "");
                var index = text.indexOf(", ");
                if (index !== -1) {
                  text = text.substring(0, index);
                }
                console.log("text-after: ", text);
				arrTemp.push(text.trim());
			}
		});

		return arrTemp;
	}

      setUserInfo: function (data) {
        // Nivel de formación
        Cornerstone.VOLKSWAGEN.TrainingUserDetail.userLevel = data.level;

        // Venta o Postventa
        switch (data.profile) {
          case "Area_VO":
            Cornerstone.VOLKSWAGEN.TrainingUserDetail.pv = false;
            break;
          case "Area_Ventas":
            Cornerstone.VOLKSWAGEN.TrainingUserDetail.pv = false;
            break;
          case "Area_Posventa":
            Cornerstone.VOLKSWAGEN.TrainingUserDetail.pv = true;
            break;
          default:
            Cornerstone.VOLKSWAGEN.TrainingUserDetail.pv = false;
            break;
        }

        // Marca
        switch (data.brand) {
          case "SEAT|CUPRA":
            Cornerstone.VOLKSWAGEN.TrainingUserDetail.brand = 0;
            break;
          case "SEAT":
            Cornerstone.VOLKSWAGEN.TrainingUserDetail.brand = 1;
            break;
          case "CUPRA":
            Cornerstone.VOLKSWAGEN.TrainingUserDetail.brand = 2;
            break;
          default:
            Cornerstone.VOLKSWAGEN.TrainingUserDetail.brand = -1;
            break;
        }

        //Posición
        Cornerstone.VOLKSWAGEN.TrainingUserDetail.position = data.positions;
      },

      createCarrousel: function () {
        // Carrousel de "Mantente en Forma"

            link: "https://google.com",

            title: "img2"},
          {
            src: "/clientimg/talentimpulseplatform/welcome/images/PonteForma/Mantente_en_forma3.png",
            link: "https://google.com",
            title: "img3"}];

        var currentIndex = 0;
        var totalImages = imagesMantenteEnForma.length;
        var interval;

        var carouselImages = $(
          '<div style="overflow: hidden;width: 100%">').addClass("carouselImages");
        var prevButton = $(
          '<button type="button" class="prevImg" data-id="btn">&#10094;</button>');
        var nextButton = $(
          '<button type="button" class="nextImg" data-id="btn">&#10095;</button>');

        Cornerstone.VOLKSWAGEN.TrainingUserDetail.carouselPonteEnForma.append(
          carouselImages);

        $.each(imagesMantenteEnForma, function (index, image) {
          var imgPonteEnForma = $(
            '<img style="width: 100%;transition: 0.5s;object-fit: cover;" class="zoomImg">')
            .attr("src", image.src)
            .attr("alt", image.title);
          var linkElement = $("<a>")
            .attr("href", image.link)
            .append(imgPonteEnForma);
          carouselImages.append(linkElement);
        });

        Cornerstone.VOLKSWAGEN.TrainingUserDetail.carouselPonteEnForma.append(
          prevButton);
        Cornerstone.VOLKSWAGEN.TrainingUserDetail.carouselPonteEnForma.append(
          nextButton);

        var tituloMantenteEnForma = $("<h1>")
          .addClass("tituloCupra")
          .text("MANTENTE EN FORMA");
        Cornerstone.VOLKSWAGEN.TrainingUserDetail.divTituloMantenteEnForma.append(
          tituloMantenteEnForma);

        function showImage(index) {
          carouselImages.children().hide();
          carouselImages.children().eq(index).show();
        }

        function nextImage() {
          currentIndex++;
          if (currentIndex >= totalImages) {
            currentIndex = 0;
          }
          showImage(currentIndex);
        }

        function prevImage() {
          currentIndex--;
          if (currentIndex < 0) {
            currentIndex = totalImages - 1;
          }
          showImage(currentIndex);
        }

        showImage(currentIndex);
        interval = setInterval(nextImage, 7000);

        nextButton.click(function () {
          clearInterval(interval);
          nextImage();
          interval = setInterval(nextImage, 7000);
        });

        prevButton.click(function () {
          clearInterval(interval);
          prevImage();
          interval = setInterval(nextImage, 7000);
        });

        console.log("Carrousel 'Mantente en forma' creado");
      },
